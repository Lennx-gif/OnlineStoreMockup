<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#475569" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Container card background -->
  <rect width="800" height="600" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative background rings -->
  <circle cx="680" cy="120" r="110" fill="#fff" opacity="0.35"/>
  <circle cx="120" cy="500" r="130" fill="#fff" opacity="0.25"/>

  <!-- Category & Feature Badges -->
  <g transform="translate(48, 48)">
    <rect width="130" height="32" rx="16" fill="#475569" opacity="0.12"/>
    <text x="65" y="21" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">BAGS & TRAVEL</text>
  </g>
  <g transform="translate(560, 48)">
    <rect width="192" height="32" rx="16" fill="#ffffff" opacity="0.85"/>
    <text x="96" y="20" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Plush Fleece · Drop Protection</text>
  </g>

  <!-- Product Illustration -->
  <g filter="url(#softGlow)">
    
            <ellipse cx="400" cy="460" rx="170" ry="18" fill="#cbd5e0" opacity="0.6"/>
            <!-- Sleeve Body -->
            <rect x="240" y="250" width="320" height="200" rx="24" fill="#334155" stroke="#475569" stroke-width="6"/>
            <!-- Top Zipper -->
            <line x1="260" y1="270" x2="540" y2="270" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
            <circle cx="530" cy="270" r="6" fill="#94a3b8"/>
            <!-- Front Accessory Pocket -->
            <rect x="260" y="310" width="280" height="110" rx="12" fill="#1e293b"/>
        
  </g>

  <!-- Product Caption Line -->
  <text x="400" y="555" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.3" text-anchor="middle">Water-Resistant Laptop Sleeve</text>
</svg>