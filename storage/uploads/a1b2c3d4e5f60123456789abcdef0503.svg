<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2563eb" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Container card background -->
  <rect width="800" height="600" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative background rings -->
  <circle cx="680" cy="120" r="110" fill="#fff" opacity="0.35"/>
  <circle cx="120" cy="500" r="130" fill="#fff" opacity="0.25"/>

  <!-- Category & Feature Badges -->
  <g transform="translate(48, 48)">
    <rect width="130" height="32" rx="16" fill="#2563eb" opacity="0.12"/>
    <text x="65" y="21" fill="#2563eb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">BAGS & TRAVEL</text>
  </g>
  <g transform="translate(560, 48)">
    <rect width="192" height="32" rx="16" fill="#ffffff" opacity="0.85"/>
    <text x="96" y="20" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Semi-Rigid · Dual Layer</text>
  </g>

  <!-- Product Illustration -->
  <g filter="url(#softGlow)">
    
            <ellipse cx="400" cy="460" rx="140" ry="18" fill="#cbd5e0" opacity="0.6"/>
            <!-- Clamshell Organizer -->
            <rect x="270" y="250" width="260" height="190" rx="28" fill="#1e293b" stroke="#334155" stroke-width="6"/>
            <!-- Wrap-around zipper line -->
            <rect x="280" y="260" width="240" height="170" rx="20" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="8 6"/>
            <rect x="360" y="330" width="80" height="25" rx="6" fill="#334155"/>
        
  </g>

  <!-- Product Caption Line -->
  <text x="400" y="555" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.3" text-anchor="middle">Travel Electronics Cable Pouch</text>
</svg>