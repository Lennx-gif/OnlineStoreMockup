<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf2f7"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2b6cb0" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Container card background -->
  <rect width="800" height="600" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative background rings -->
  <circle cx="680" cy="120" r="110" fill="#fff" opacity="0.35"/>
  <circle cx="120" cy="500" r="130" fill="#fff" opacity="0.25"/>

  <!-- Category & Feature Badges -->
  <g transform="translate(48, 48)">
    <rect width="130" height="32" rx="16" fill="#2b6cb0" opacity="0.12"/>
    <text x="65" y="21" fill="#2b6cb0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">BAGS & TRAVEL</text>
  </g>
  <g transform="translate(560, 48)">
    <rect width="192" height="32" rx="16" fill="#ffffff" opacity="0.85"/>
    <text x="96" y="20" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Weatherproof · 16" Laptop Fit</text>
  </g>

  <!-- Product Illustration -->
  <g filter="url(#softGlow)">
    
            <ellipse cx="400" cy="480" rx="140" ry="18" fill="#cbd5e0" opacity="0.6"/>
            <!-- Top Handle -->
            <path d="M370 190 C370 160 430 160 430 190" fill="none" stroke="#2d3748" stroke-width="12" stroke-linecap="round"/>
            <!-- Backpack Shell -->
            <path d="M300 240 C300 180 500 180 500 240 L520 440 C520 460 280 460 280 440 Z" fill="#1a202c" stroke="#2d3748" stroke-width="6"/>
            <!-- Front Compartment -->
            <rect x="310" y="300" width="180" height="130" rx="16" fill="#2d3748"/>
            <line x1="330" y1="330" x2="470" y2="330" stroke="#4a5568" stroke-width="4"/>
            <!-- Accent clip -->
            <rect x="390" y="325" width="20" height="10" rx="2" fill="#315ce8"/>
        
  </g>

  <!-- Product Caption Line -->
  <text x="400" y="555" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.3" text-anchor="middle">Commuter Tech Backpack (25L)</text>
</svg>