<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf7f4"/>
      <stop offset="100%" stop-color="#eee1d5"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350f" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Container card background -->
  <rect width="800" height="600" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative background rings -->
  <circle cx="680" cy="120" r="110" fill="#fff" opacity="0.35"/>
  <circle cx="120" cy="500" r="130" fill="#fff" opacity="0.25"/>

  <!-- Category & Feature Badges -->
  <g transform="translate(48, 48)">
    <rect width="130" height="32" rx="16" fill="#78350f" opacity="0.12"/>
    <text x="65" y="21" fill="#78350f" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">GROCERIES</text>
  </g>
  <g transform="translate(560, 48)">
    <rect width="192" height="32" rx="16" fill="#ffffff" opacity="0.85"/>
    <text x="96" y="20" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Single Origin · Whole Bean 500g</text>
  </g>

  <!-- Product Illustration -->
  <g filter="url(#softGlow)">
    
            <ellipse cx="400" cy="480" rx="120" ry="16" fill="#cbd5e0" opacity="0.6"/>
            <!-- Kraft Coffee Pouch -->
            <path d="M320 220 L480 220 L490 450 C490 465 310 465 310 450 Z" fill="#92400e" stroke="#78350f" stroke-width="6"/>
            <!-- Heat seal top -->
            <rect x="315" y="210" width="170" height="20" rx="4" fill="#78350f"/>
            <!-- Degassing Valve -->
            <circle cx="400" cy="270" r="8" fill="#b45309" stroke="#d97706" stroke-width="2"/>
            <!-- Badge on Pouch -->
            <rect x="340" y="320" width="120" height="90" rx="10" fill="#fef3c7"/>
            <circle cx="400" cy="350" r="14" fill="#78350f"/>
            <line x1="360" y1="380" x2="440" y2="380" stroke="#92400e" stroke-width="3"/>
            <line x1="375" y1="395" x2="425" y2="395" stroke="#92400e" stroke-width="3"/>
        
  </g>

  <!-- Product Caption Line -->
  <text x="400" y="555" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.3" text-anchor="middle">Artisan Medium-Roast Coffee Beans</text>
</svg>