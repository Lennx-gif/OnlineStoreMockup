<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#d97706" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Container card background -->
  <rect width="800" height="600" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative background rings -->
  <circle cx="680" cy="120" r="110" fill="#fff" opacity="0.35"/>
  <circle cx="120" cy="500" r="130" fill="#fff" opacity="0.25"/>

  <!-- Category & Feature Badges -->
  <g transform="translate(48, 48)">
    <rect width="130" height="32" rx="16" fill="#d97706" opacity="0.12"/>
    <text x="65" y="21" fill="#d97706" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">GROCERIES</text>
  </g>
  <g transform="translate(560, 48)">
    <rect width="192" height="32" rx="16" fill="#ffffff" opacity="0.85"/>
    <text x="96" y="20" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">100% Pure · Wildflower Apiary</text>
  </g>

  <!-- Product Illustration -->
  <g filter="url(#softGlow)">
    
            <ellipse cx="400" cy="480" rx="110" ry="16" fill="#cbd5e0" opacity="0.6"/>
            <!-- Glass Jar -->
            <rect x="330" y="240" width="140" height="210" rx="30" fill="#fef3c7" stroke="#fbbf24" stroke-width="4"/>
            <!-- Golden Honey fill -->
            <rect x="335" y="270" width="130" height="170" rx="20" fill="#d97706"/>
            <!-- Lid -->
            <rect x="345" y="210" width="110" height="35" rx="8" fill="#78350f"/>
            <!-- Honeycomb Badge -->
            <polygon points="400,320 425,335 425,365 400,380 375,365 375,335" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
        
  </g>

  <!-- Product Caption Line -->
  <text x="400" y="555" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.3" text-anchor="middle">Pure Raw Forest Honey (500g)</text>
</svg>