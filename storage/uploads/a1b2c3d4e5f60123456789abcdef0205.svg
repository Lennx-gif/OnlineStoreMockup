<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf2f7"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0d9488" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Container card background -->
  <rect width="800" height="600" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative background rings -->
  <circle cx="680" cy="120" r="110" fill="#fff" opacity="0.35"/>
  <circle cx="120" cy="500" r="130" fill="#fff" opacity="0.25"/>

  <!-- Category & Feature Badges -->
  <g transform="translate(48, 48)">
    <rect width="130" height="32" rx="16" fill="#0d9488" opacity="0.12"/>
    <text x="65" y="21" fill="#0d9488" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">ACCESSORIES</text>
  </g>
  <g transform="translate(560, 48)">
    <rect width="192" height="32" rx="16" fill="#ffffff" opacity="0.85"/>
    <text x="96" y="20" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">24h Cold · 12h Hot</text>
  </g>

  <!-- Product Illustration -->
  <g filter="url(#softGlow)">
    
            <ellipse cx="400" cy="490" rx="80" ry="16" fill="#cbd5e0" opacity="0.6"/>
            <!-- Bottle Body -->
            <rect x="340" y="220" width="120" height="250" rx="24" fill="#0f766e" stroke="#115e59" stroke-width="4"/>
            <!-- Cap & Loop -->
            <rect x="360" y="170" width="80" height="50" rx="10" fill="#134e4a"/>
            <circle cx="400" cy="145" r="22" fill="none" stroke="#2dd4bf" stroke-width="8"/>
            <!-- Matte highlight -->
            <path d="M360 240 L360 450" stroke="#2dd4bf" stroke-width="6" opacity="0.4" stroke-linecap="round"/>
        
  </g>

  <!-- Product Caption Line -->
  <text x="400" y="555" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.3" text-anchor="middle">Insulated Thermal Flask (750ml)</text>
</svg>