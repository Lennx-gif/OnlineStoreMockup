<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Container card background -->
  <rect width="800" height="600" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative background rings -->
  <circle cx="680" cy="120" r="110" fill="#fff" opacity="0.35"/>
  <circle cx="120" cy="500" r="130" fill="#fff" opacity="0.25"/>

  <!-- Category & Feature Badges -->
  <g transform="translate(48, 48)">
    <rect width="130" height="32" rx="16" fill="#06b6d4" opacity="0.12"/>
    <text x="65" y="21" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">PERIPHERALS</text>
  </g>
  <g transform="translate(560, 48)">
    <rect width="192" height="32" rx="16" fill="#ffffff" opacity="0.85"/>
    <text x="96" y="20" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">26K DPI · 80h Battery</text>
  </g>

  <!-- Product Illustration -->
  <g filter="url(#softGlow)">
    
            <ellipse cx="400" cy="460" rx="100" ry="18" fill="#cbd5e0" opacity="0.6"/>
            <!-- Mouse Body -->
            <path d="M330 330 C330 240 470 240 470 330 C470 430 330 430 330 330 Z" fill="#0f172a" stroke="#1e293b" stroke-width="6"/>
            <!-- Split buttons -->
            <path d="M400 240 L400 310" stroke="#334155" stroke-width="4"/>
            <!-- Scroll Wheel -->
            <rect x="393" y="260" width="14" height="32" rx="6" fill="#06b6d4"/>
            <!-- RGB Glow line -->
            <path d="M345 360 C370 390 430 390 455 360" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.7"/>
        
  </g>

  <!-- Product Caption Line -->
  <text x="400" y="555" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.3" text-anchor="middle">High-Precision Wireless Mouse</text>
</svg>